<!DOCTYPE html>

<html class="dark" lang="en"><head>
<meta charset="utf-8"/>
<meta content="width=device-width, initial-scale=1.0" name="viewport"/>
<title>EraLink | First-Time Setup</title>
<script src="https://cdn.tailwindcss.com?plugins=forms,container-queries"></script>
<link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;600;700;800;900&amp;display=swap" rel="stylesheet"/>
<link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&amp;display=swap" rel="stylesheet"/>
<link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&amp;display=swap" rel="stylesheet"/>
<script id="tailwind-config">
        tailwind.config = {
            darkMode: "class",
            theme: {
                extend: {
                    "colors": {
                        "on-tertiary-fixed-variant": "#2f2ebe",
                        "secondary-fixed-dim": "#ffb95f",
                        "surface-container-highest": "#2d3449",
                        "surface-container-high": "#222a3d",
                        "surface-bright": "#31394d",
                        "tertiary-container": "#9699ff",
                        "surface-container-low": "#131b2e",
                        "outline-variant": "#3c4a42",
                        "inverse-primary": "#006c49",
                        "on-background": "#dae2fd",
                        "surface-dim": "#0b1326",
                        "surface": "#0b1326",
                        "on-secondary-fixed-variant": "#653e00",
                        "on-primary-fixed-variant": "#005236",
                        "tertiary": "#c0c1ff",
                        "surface-container-lowest": "#060e20",
                        "surface-tint": "#4edea3",
                        "secondary": "#ffb95f",
                        "surface-variant": "#2d3449",
                        "on-error": "#690005",
                        "tertiary-fixed-dim": "#c0c1ff",
                        "inverse-on-surface": "#283044",
                        "on-primary-container": "#00422b",
                        "primary-fixed": "#6ffbbe",
                        "on-tertiary-container": "#1d17b2",
                        "on-primary-fixed": "#002113",
                        "on-primary": "#003824",
                        "background": "#0b1326",
                        "outline": "#86948a",
                        "on-secondary-fixed": "#2a1700",
                        "on-secondary-container": "#5b3800",
                        "on-surface-variant": "#bbcabf",
                        "on-surface": "#dae2fd",
                        "surface-container": "#171f33",
                        "error-container": "#93000a",
                        "tertiary-fixed": "#e1e0ff",
                        "secondary-container": "#ee9800",
                        "on-error-container": "#ffdad6",
                        "primary-container": "#10b981",
                        "inverse-surface": "#dae2fd",
                        "primary-fixed-dim": "#4edea3",
                        "on-tertiary-fixed": "#07006c",
                        "primary": "#4edea3",
                        "on-secondary": "#472a00",
                        "secondary-fixed": "#ffddb8",
                        "on-tertiary": "#1000a9",
                        "error": "#ffb4ab"
                    },
                    "borderRadius": {
                        "DEFAULT": "1rem",
                        "lg": "2rem",
                        "xl": "3rem",
                        "full": "9999px"
                    },
                    "spacing": {
                        "sm": "12px",
                        "gutter": "24px",
                        "xs": "4px",
                        "lg": "48px",
                        "margin": "32px",
                        "xl": "80px",
                        "base": "8px",
                        "md": "24px"
                    },
                    "fontFamily": {
                        "label-sm": ["Plus Jakarta Sans"],
                        "h2": ["Plus Jakarta Sans"],
                        "h3": ["Plus Jakarta Sans"],
                        "body-md": ["Plus Jakarta Sans"],
                        "h1": ["Plus Jakarta Sans"],
                        "body-lg": ["Plus Jakarta Sans"]
                    },
                    "fontSize": {
                        "label-sm": ["13px", {"lineHeight": "1", "letterSpacing": "0.05em", "fontWeight": "600"}],
                        "h2": ["36px", {"lineHeight": "1.2", "letterSpacing": "-0.01em", "fontWeight": "700"}],
                        "h3": ["24px", {"lineHeight": "1.3", "fontWeight": "600"}],
                        "body-md": ["16px", {"lineHeight": "1.6", "fontWeight": "400"}],
                        "h1": ["48px", {"lineHeight": "1.1", "letterSpacing": "-0.02em", "fontWeight": "700"}],
                        "body-lg": ["18px", {"lineHeight": "1.6", "fontWeight": "400"}]
                    }
                }
            }
        }
    </script>
<style>
        body {
            background-color: #0b1326;
            color: #dae2fd;
        }
    </style>
</head>
<body class="min-h-screen font-['Plus_Jakarta_Sans'] antialiased bg-background text-on-background relative overflow-x-hidden flex items-center justify-center p-4 md:p-margin">
<!-- Decorative Background Elements -->
<div class="fixed top-[-10%] left-[-10%] w-[50vw] h-[50vw] rounded-full bg-primary-container/10 blur-[120px] pointer-events-none"></div>
<div class="fixed bottom-[-10%] right-[-10%] w-[60vw] h-[60vw] rounded-full bg-secondary-container/5 blur-[150px] pointer-events-none"></div>
<main class="w-full max-w-3xl">
<!-- Setup Card -->
<div class="w-full bg-surface-container-low/40 backdrop-blur-2xl border border-white/10 shadow-[0_20px_50px_rgba(0,0,0,0.5)] shadow-primary-container/5 rounded-lg md:rounded-xl p-md md:p-lg relative overflow-hidden">
<!-- Card Header -->
<div class="mb-lg text-center md:text-left">
<h1 class="font-h2 text-h2 text-on-surface mb-xs">Complete Profile</h1>
<p class="font-body-md text-body-md text-on-surface-variant">Let's set up your academic presence on ScholarNet.</p>
</div>
<form class="space-y-lg">
<!-- Profile Picture Area -->
<div class="flex flex-col items-center md:flex-row md:items-start gap-md">
<div class="relative group cursor-pointer">
<div class="w-32 h-32 rounded-full bg-black/20 shadow-inner border border-white/5 flex items-center justify-center overflow-hidden transition-all duration-300 group-hover:border-secondary-fixed-dim/50 group-hover:shadow-[inset_0_2px_10px_rgba(0,0,0,0.5),0_0_15px_rgba(255,185,95,0.1)]">
<span class="material-symbols-outlined text-4xl text-on-surface-variant group-hover:text-secondary-fixed-dim transition-colors" data-icon="add_a_photo">add_a_photo</span>
</div>
<div class="absolute inset-0 rounded-full ring-1 ring-inset ring-white/10 group-hover:ring-secondary-fixed-dim/30 pointer-events-none"></div>
</div>
<div class="flex-1 space-y-4 w-full">
<div>
<label class="block font-label-sm text-label-sm text-on-surface-variant uppercase tracking-widest mb-2">Full Name</label>
<input class="w-full bg-black/20 shadow-inner border border-white/5 rounded-[1.5rem] px-6 py-4 font-body-md text-body-md text-on-surface placeholder-on-surface-variant/50 focus:outline-none focus:border-secondary-fixed-dim focus:ring-1 focus:ring-secondary-fixed-dim/50 transition-all duration-300" placeholder="Your full name" type="text"/>
</div>
</div>
</div>
<!-- User Type Toggle -->
<div>
<label class="block font-label-sm text-label-sm text-on-surface-variant uppercase tracking-widest mb-4">I am a...</label>
<div class="grid grid-cols-1 md:grid-cols-2 gap-4">
<!-- Active Option -->
<div class="relative rounded-[1.5rem] p-[1px] bg-gradient-to-br from-primary to-secondary/30 cursor-pointer overflow-hidden group">
<div class="absolute inset-0 bg-primary/5 blur-xl group-hover:bg-primary/10 transition-colors"></div>
<div class="relative bg-surface-container-high/80 backdrop-blur-xl rounded-[calc(1.5rem-1px)] p-6 h-full border border-transparent shadow-[inset_0_0_20px_rgba(78,222,163,0.1)]">
<div class="flex items-center gap-4">
<div class="w-12 h-12 rounded-full bg-primary-container/20 flex items-center justify-center border border-primary/30">
<span class="material-symbols-outlined text-primary" data-icon="school" style="font-variation-settings: 'FILL' 1;">school</span>
</div>
<div>
<h3 class="font-h3 text-[20px] leading-tight font-bold text-on-surface">Student</h3>
<p class="font-body-md text-sm text-on-surface-variant">Currently enrolled</p>
</div>
</div>
</div>
</div>
<!-- Inactive Option -->
<div class="relative rounded-[1.5rem] p-[1px] bg-white/5 cursor-pointer hover:bg-white/10 transition-colors overflow-hidden">
<div class="relative bg-surface-container-low/50 backdrop-blur-xl rounded-[calc(1.5rem-1px)] p-6 h-full border border-white/5 shadow-inner">
<div class="flex items-center gap-4 opacity-70">
<div class="w-12 h-12 rounded-full bg-black/20 flex items-center justify-center border border-white/5">
<span class="material-symbols-outlined text-on-surface-variant" data-icon="workspace_premium">workspace_premium</span>
</div>
<div>
<h3 class="font-h3 text-[20px] leading-tight font-semibold text-on-surface">Alumni</h3>
<p class="font-body-md text-sm text-on-surface-variant">Graduated</p>
</div>
</div>
</div>
</div>
</div>
</div>
<!-- Field & Bio -->
<div class="space-y-6">
<div>
<label class="block font-label-sm text-label-sm text-on-surface-variant uppercase tracking-widest mb-2">Academic Department</label>
<div class="relative">
<select class="w-full bg-black/20 shadow-inner border border-white/5 rounded-[1.5rem] px-6 py-4 font-body-md text-body-md text-on-surface appearance-none focus:outline-none focus:border-secondary-fixed-dim focus:ring-1 focus:ring-secondary-fixed-dim/50 transition-all duration-300">
<option class="bg-surface-container-high text-on-surface-variant" disabled="" selected="" value="">Select your field of study...</option>
<option class="bg-surface-container-high text-on-surface" value="cs">Computer Science</option>
<option class="bg-surface-container-high text-on-surface" value="eng">Engineering</option>
<option class="bg-surface-container-high text-on-surface" value="arts">Arts &amp; Humanities</option>
<option class="bg-surface-container-high text-on-surface" value="sci">Natural Sciences</option>
</select>
<div class="absolute inset-y-0 right-6 flex items-center pointer-events-none">
<span class="material-symbols-outlined text-on-surface-variant" data-icon="expand_more">expand_more</span>
</div>
</div>
</div>
<div>
<label class="block font-label-sm text-label-sm text-on-surface-variant uppercase tracking-widest mb-2">Short Bio</label>
<textarea class="w-full bg-black/20 shadow-inner border border-white/5 rounded-[1.5rem] px-6 py-4 font-body-md text-body-md text-on-surface placeholder-on-surface-variant/50 focus:outline-none focus:border-secondary-fixed-dim focus:ring-1 focus:ring-secondary-fixed-dim/50 transition-all duration-300 resize-none" placeholder="Tell the network a bit about your research interests and goals..." rows="4"></textarea>
</div>
</div>
<!-- Skills Area -->
<div>
<label class="block font-label-sm text-label-sm text-on-surface-variant uppercase tracking-widest mb-3">Core Skills &amp; Interests</label>
<div class="flex flex-wrap gap-3">
<span class="inline-flex items-center px-4 py-2 rounded-full bg-primary-container/20 border border-primary text-primary font-label-sm text-sm shadow-[inset_0_0_10px_rgba(78,222,163,0.2)]">Machine Learning</span>
<span class="inline-flex items-center px-4 py-2 rounded-full bg-primary-container/20 border border-primary text-primary font-label-sm text-sm shadow-[inset_0_0_10px_rgba(78,222,163,0.2)]">Data Analysis</span>
<span class="inline-flex items-center px-4 py-2 rounded-full bg-white/5 border border-white/10 text-on-surface-variant hover:bg-white/10 transition-colors cursor-pointer font-label-sm text-sm">
<span class="material-symbols-outlined text-sm mr-1" data-icon="add">add</span> Add Skill
                        </span>
</div>
</div>
<!-- Action Button -->
<div class="pt-6 flex justify-end">
<button class="w-full md:w-auto px-10 py-4 bg-gradient-to-r from-primary to-inverse-primary rounded-full font-label-sm text-on-primary-fixed uppercase tracking-widest hover:shadow-[0_0_30px_rgba(78,222,163,0.4)] transition-all duration-300 active:scale-95 flex items-center justify-center gap-2" type="button">
<span>Complete Profile</span>
<span class="material-symbols-outlined text-lg" data-icon="arrow_forward">arrow_forward</span>
</button>
</div>
</form>
</div>
</main>
</body></html>
