<!DOCTYPE html>
<html lang="en" class="dark">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Expanded Post Composer</title>
  <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="min-h-screen bg-[#0b1326] text-white antialiased">
  <main class="mx-auto flex min-h-screen w-full max-w-3xl items-center px-4 py-10 sm:px-6 lg:px-8">
    <section class="w-full rounded-[32px] border border-white/10 bg-[#131b2e]/60 p-4 shadow-[0_24px_48px_rgba(2,8,24,0.4)] backdrop-blur-2xl sm:p-6">
      <div class="flex flex-col gap-4">
        <div class="flex flex-col gap-3 md:flex-row md:items-center md:justify-between">
          <div>
            <p class="text-xs font-bold uppercase tracking-[0.2em] text-slate-500">Composer</p>
            <h1 class="mt-1 text-lg font-black tracking-tight text-white md:text-2xl">Share knowledge with the feed</h1>
          </div>
          <div class="inline-flex rounded-full border border-white/10 bg-black/10 p-1 shadow-inner shadow-black/20">
            <button class="rounded-full border border-emerald-300/40 bg-emerald-300/18 px-4 py-2 text-xs font-extrabold uppercase tracking-[0.14em] text-emerald-100">Information</button>
            <button class="rounded-full px-4 py-2 text-xs font-extrabold uppercase tracking-[0.14em] text-slate-400">Question</button>
          </div>
        </div>

        <input type="text" value="Title of your post" class="w-full rounded-[22px] border border-white/10 bg-black/20 px-4 py-3 text-sm text-white placeholder:text-slate-500 focus:outline-none" />

        <textarea rows="8" class="min-h-[220px] w-full resize-none rounded-[28px] border border-white/10 bg-black/20 px-4 py-4 text-sm text-white placeholder:text-slate-500 focus:outline-none" placeholder="Share a practical insight, ask a question, or tag an alumni expert..."></textarea>

        <div class="rounded-[24px] border border-white/10 bg-black/20 px-4 py-3">
          <div class="flex flex-wrap items-center gap-2">
            <span class="rounded-full border border-white/10 bg-white/10 px-3 py-1 text-xs text-slate-200">#career</span>
            <span class="rounded-full border border-white/10 bg-white/10 px-3 py-1 text-xs text-slate-200">#mentorship</span>
            <input class="min-w-[160px] flex-1 bg-transparent py-1 text-sm text-white placeholder:text-slate-500 focus:outline-none" placeholder="Add tags (press Enter)..." />
          </div>
        </div>

        <div class="flex items-center justify-end border-t border-white/10 pt-4">
          <button class="rounded-full border border-[#ffb95f] border-t-[#ffb95f] bg-gradient-to-b from-emerald-300 via-emerald-500 to-emerald-950 px-5 py-2 text-xs font-extrabold uppercase tracking-[0.14em] text-emerald-50 shadow-[0_10px_24px_rgba(0,0,0,0.24)]">
            Post
          </button>
        </div>
      </div>
    </section>
  </main>
</body>
</html>
