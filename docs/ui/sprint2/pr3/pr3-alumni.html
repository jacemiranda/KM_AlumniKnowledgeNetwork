<!DOCTYPE html>
<html class="dark" lang="en">
<head>
<meta charset="utf-8"/>
<meta content="width=device-width, initial-scale=1.0" name="viewport"/>
<title>EraLink | Alumni / Mentors</title>
<script src="https://cdn.tailwindcss.com?plugins=forms,container-queries"></script>
<link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800;900&display=swap" rel="stylesheet"/>
<script>
  tailwind.config = {
    darkMode: 'class',
    theme: {
      extend: {
        colors: {
          background: '#0b1326',
          primary: '#4edea3',
          secondary: '#ffb95f',
        },
        boxShadow: {
          liquid: '0 20px 40px -18px rgba(0,0,0,0.55), 0 0 0 1px rgba(255,255,255,0.02)'
        },
        borderRadius: {
          xl: '1rem',
          '2xl': '1.5rem',
          '3xl': '2rem',
          full: '9999px',
        },
        fontFamily: {
          body: ['Plus Jakarta Sans'],
        }
      }
    }
  }
</script>
</head>
<body class="min-h-screen bg-background font-body text-white">
<div class="fixed inset-0 -z-10 overflow-hidden pointer-events-none">
  <div class="absolute -left-16 top-0 h-80 w-80 rounded-full bg-primary/10 blur-[120px]"></div>
  <div class="absolute -right-16 bottom-0 h-80 w-80 rounded-full bg-secondary/10 blur-[120px]"></div>
</div>
<main class="mx-auto flex min-h-screen w-full max-w-6xl flex-col gap-6 px-4 py-6 md:px-8 md:py-8">
  <section class="rounded-[32px] border border-white/10 bg-[#131b2e]/60 p-4 shadow-liquid backdrop-blur-2xl md:p-6">
    <div class="space-y-2">
      <p class="text-xs font-bold uppercase tracking-[0.2em] text-emerald-200">Discover</p>
      <h1 class="text-2xl font-black tracking-tight text-white md:text-3xl">Alumni / Mentors</h1>
      <p class="max-w-2xl text-sm leading-relaxed text-slate-400 md:text-[15px]">Browse alumni contributors, compare helpfulness, and ask a question directly from the grid.</p>
    </div>
  </section>

  <section class="rounded-[32px] border border-white/10 bg-[#131b2e]/60 p-4 shadow-liquid backdrop-blur-2xl md:p-5">
    <div class="flex flex-wrap items-center gap-3">
      <select class="cursor-pointer rounded-xl border border-white/10 bg-white/5 px-3 py-2 text-xs text-slate-300 backdrop-blur transition focus:border-emerald-300/40 focus:outline-none">
        <option>All Fields</option>
        <option>Software Development</option>
      </select>
      <select class="cursor-pointer rounded-xl border border-white/10 bg-white/5 px-3 py-2 text-xs text-slate-300 backdrop-blur transition focus:border-emerald-300/40 focus:outline-none">
        <option>All Skills</option>
        <option>React</option>
      </select>
      <div class="flex-1"></div>
      <div class="flex items-center gap-1.5">
        <span class="text-[10px] uppercase tracking-wider text-slate-500">Sort:</span>
        <button class="cursor-pointer rounded-lg border border-emerald-300/30 bg-emerald-300/15 px-3 py-1.5 text-[11px] font-bold uppercase tracking-wider text-emerald-200">Top Authority</button>
        <button class="cursor-pointer rounded-lg border border-transparent px-3 py-1.5 text-[11px] font-bold uppercase tracking-wider text-slate-500 hover:bg-white/5 hover:text-slate-300">Alphabetical</button>
        <button class="cursor-pointer rounded-lg border border-transparent px-3 py-1.5 text-[11px] font-bold uppercase tracking-wider text-slate-500 hover:bg-white/5 hover:text-slate-300">Most Recent</button>
      </div>
    </div>
  </section>

  <section class="rounded-[32px] border border-white/10 bg-[#131b2e]/60 p-4 shadow-liquid backdrop-blur-2xl md:p-6">
    <div class="grid gap-4 md:grid-cols-2 lg:grid-cols-3">
      <article class="group flex h-full flex-col rounded-[32px] border border-white/10 bg-[#131b2e]/60 p-5 shadow-liquid transition hover:border-emerald-300/20 hover:bg-white/[0.08]">
        <div class="flex items-start gap-4">
          <div class="flex h-14 w-14 flex-shrink-0 items-center justify-center rounded-full bg-gradient-to-br from-emerald-400/30 to-cyan-400/30 text-base font-bold text-emerald-100 ring-2 ring-white/10">AA</div>
          <div class="min-w-0 flex-1">
            <h3 class="truncate text-base font-bold text-white transition-colors group-hover:text-emerald-100">Avery Alumni</h3>
            <p class="mt-0.5 text-xs text-emerald-300/80">Software Development</p>
            <p class="mt-1 line-clamp-2 text-xs text-slate-400">Frontend mentor</p>
          </div>
        </div>
        <div class="mt-4 flex items-center gap-1 text-[#ffb95f]">
          <svg class="h-4 w-4 drop-shadow-[0_0_8px_rgba(255,185,95,0.25)]" fill="currentColor" viewBox="0 0 20 20"><path d="M9.049 2.927c.3-.921 1.603-.921 1.902 0l1.22 3.75a1 1 0 0 0 .95.69h3.942c.969 0 1.371 1.24.588 1.81l-3.19 2.318a1 1 0 0 0-.364 1.118l1.22 3.75c.3.921-.755 1.688-1.538 1.118l-3.19-2.318a1 1 0 0 0-1.176 0l-3.19 2.318c-.783.57-1.838-.197-1.539-1.118l1.22-3.75a1 1 0 0 0-.363-1.118L2.3 9.177c-.783-.57-.38-1.81.588-1.81H6.83a1 1 0 0 0 .95-.69l1.22-3.75Z"/></svg>
          <svg class="h-4 w-4 drop-shadow-[0_0_8px_rgba(255,185,95,0.25)]" fill="currentColor" viewBox="0 0 20 20"><path d="M9.049 2.927c.3-.921 1.603-.921 1.902 0l1.22 3.75a1 1 0 0 0 .95.69h3.942c.969 0 1.371 1.24.588 1.81l-3.19 2.318a1 1 0 0 0-.364 1.118l1.22 3.75c.3.921-.755 1.688-1.538 1.118l-3.19-2.318a1 1 0 0 0-1.176 0l-3.19 2.318c-.783.57-1.838-.197-1.539-1.118l1.22-3.75a1 1 0 0 0-.363-1.118L2.3 9.177c-.783-.57-.38-1.81.588-1.81H6.83a1 1 0 0 0 .95-.69l1.22-3.75Z"/></svg>
          <svg class="h-4 w-4 drop-shadow-[0_0_8px_rgba(255,185,95,0.25)]" fill="currentColor" viewBox="0 0 20 20"><path d="M9.049 2.927c.3-.921 1.603-.921 1.902 0l1.22 3.75a1 1 0 0 0 .95.69h3.942c.969 0 1.371 1.24.588 1.81l-3.19 2.318a1 1 0 0 0-.364 1.118l1.22 3.75c.3.921-.755 1.688-1.538 1.118l-3.19-2.318a1 1 0 0 0-1.176 0l-3.19 2.318c-.783.57-1.838-.197-1.539-1.118l1.22-3.75a1 1 0 0 0-.363-1.118L2.3 9.177c-.783-.57-.38-1.81.588-1.81H6.83a1 1 0 0 0 .95-.69l1.22-3.75Z"/></svg>
          <svg class="h-4 w-4 drop-shadow-[0_0_8px_rgba(255,185,95,0.25)]" fill="currentColor" viewBox="0 0 20 20"><path d="M9.049 2.927c.3-.921 1.603-.921 1.902 0l1.22 3.75a1 1 0 0 0 .95.69h3.942c.969 0 1.371 1.24.588 1.81l-3.19 2.318a1 1 0 0 0-.364 1.118l1.22 3.75c.3.921-.755 1.688-1.538 1.118l-3.19-2.318a1 1 0 0 0-1.176 0l-3.19 2.318c-.783.57-1.838-.197-1.539-1.118l1.22-3.75a1 1 0 0 0-.363-1.118L2.3 9.177c-.783-.57-.38-1.81.588-1.81H6.83a1 1 0 0 0 .95-.69l1.22-3.75Z"/></svg>
          <svg class="h-4 w-4 drop-shadow-[0_0_8px_rgba(255,185,95,0.25)]" fill="currentColor" viewBox="0 0 20 20"><path d="M9.049 2.927c.3-.921 1.603-.921 1.902 0l1.22 3.75a1 1 0 0 0 .95.69h3.942c.969 0 1.371 1.24.588 1.81l-3.19 2.318a1 1 0 0 0-.364 1.118l1.22 3.75c.3.921-.755 1.688-1.538 1.118l-3.19-2.318a1 1 0 0 0-1.176 0l-3.19 2.318c-.783.57-1.838-.197-1.539-1.118l1.22-3.75a1 1 0 0 0-.363-1.118L2.3 9.177c-.783-.57-.38-1.81.588-1.81H6.83a1 1 0 0 0 .95-.69l1.22-3.75Z"/></svg>
          <span class="ml-2 text-xs font-semibold text-[#ffb95f]">Helpful mentor</span>
        </div>
        <div class="mt-4 flex flex-wrap gap-2">
          <span class="rounded-full border border-emerald-300/15 bg-emerald-300/10 px-2.5 py-1 text-[10px] font-semibold text-emerald-100">React</span>
          <span class="rounded-full border border-emerald-300/15 bg-emerald-300/10 px-2.5 py-1 text-[10px] font-semibold text-emerald-100">UX Writing</span>
        </div>
        <div class="mt-4 flex items-center gap-4 border-t border-white/10 pt-4 text-xs">
          <div class="flex items-center gap-1.5"><span class="font-bold text-emerald-200">5</span><span class="text-slate-500">authority</span></div>
          <div class="flex items-center gap-1.5"><span class="text-slate-400">18 posts</span></div>
        </div>
        <div class="mt-4 flex flex-col gap-2 sm:flex-row">
          <a href="#" class="inline-flex flex-1 items-center justify-center rounded-full border border-white/10 bg-white/5 px-4 py-2 text-xs font-bold uppercase tracking-[0.12em] text-slate-200 transition hover:border-emerald-300/20 hover:bg-white/[0.08]">View profile</a>
          <button class="inline-flex flex-1 items-center justify-center rounded-full border border-[#ffb95f] bg-gradient-to-b from-emerald-300 via-emerald-500 to-emerald-950 px-4 py-2 text-xs font-extrabold uppercase tracking-[0.12em] text-emerald-50 transition hover:brightness-110">Ask a Question</button>
        </div>
      </article>
    </div>
  </section>
</main>
</body>
</html>
